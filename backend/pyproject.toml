[tool.poetry]
name = "superglue-backend"
version = "0.1.0"
description = "Backend for SuperGlue project"
authors = [
    {name = "Adrian He", email = "haoyuhe@uw.edu"}, 
    {name = "Crystal Liu", email = "hongyan6@uw.edu"},
    {name = "Zoe Williams", email = "zbyw@uw.edu"},
    {name = "Eric Ying", email = "junyiy2@uw.edu"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.*"
flask = "3.0.0"
flask-cors = "5.0.0"
flask-bcrypt = "1.0.1"
flask-jwt-extended = "4.7.1"
pandas = "2.1.0"
numpy = "1.25.2"
rdkit = "2023.3.3"
matplotlib = "3.10.3"
seaborn = "0.13.0"
Pillow = "11.2.1"
torch = "2.7.0"
admet_ai = "1.3.1"
chemfunc = "1.0.4"
chemprop = "1.6.1"
gunicorn = "21.2.0"
openpyxl = "3.1.2"
PyTDC = "0.4.1"
tqdm = "4.66.1"
typed-argument-parser = "1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 