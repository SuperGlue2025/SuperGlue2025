<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketcher with Flask</title>
    <!-- Updated to ketcher-standalone -->
    <script src="https://unpkg.com/ketcher-standalone@2.13.0/dist/ketcher.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/ketcher-react@2.13.0/dist/index.css">
    <style>
        #ketcher-container {
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Ketcher Chemical Structure Editor</h2>
    <div id="ketcher-container"></div>
    <input type="text" id="smiles-input" placeholder="Enter SMILES, e.g., CCO">
    <button onclick="loadMolfile()">Load Molfile</button>

    <script>
        let ketcher;

        // Modified initialization method
        window.onload = async function () {
            try {
                ketcher = await window.KetcherStandalone.create(
                    document.getElementById("ketcher-container"),
                    {
                        staticResourcesUrl: 'https://unpkg.com/ketcher-standalone@2.13.0/dist/'
                    }
                );
                console.log("Ketcher initialized successfully");
            } catch (error) {
                console.error("Ketcher initialization failed:", error);
            }
        };

        async function loadMolfile() {
            const smiles = document.getElementById("smiles-input").value.trim();
            if (!smiles) {
                alert("Please enter a valid SMILES string!");
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:5001/api/convert_molecule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ smiles })
                });

                if (!response.ok) throw new Error("Failed to get Molfile");

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                const molfile = data.mol_block;
                if (ketcher) {
                    await ketcher.setMolecule(molfile);
                } else {
                    console.error("Ketcher was not initialized correctly!");
                }
            } catch (error) {
                console.error("Failed to load Molfile:", error);
                alert("Unable to load molecular structure, please check if the backend service is running properly.");
            }
        }
    </script>
</body>
</html>
